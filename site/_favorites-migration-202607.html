<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>找回旧域收藏 · 法典图鉴</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;background:#f5f3fb;color:#25222d}
*{box-sizing:border-box}
body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px;background:
  radial-gradient(circle at 10% 10%,rgba(123,82,196,.14),transparent 38%),
  radial-gradient(circle at 90% 90%,rgba(82,164,196,.12),transparent 34%),#f5f3fb}
main{width:min(540px,100%);padding:28px;border:1px solid rgba(91,70,126,.16);border-radius:24px;background:rgba(255,255,255,.9);box-shadow:0 24px 70px rgba(52,39,75,.16)}
.mark{width:52px;height:52px;display:grid;place-items:center;border-radius:17px;background:linear-gradient(135deg,#7b52c4,#a47cdd);color:#fff;font-size:26px;font-weight:900;box-shadow:0 10px 28px rgba(123,82,196,.28)}
h1{margin:18px 0 0;font-size:24px;line-height:1.3}
.intro{margin:8px 0 0;color:#70697c;font-size:14px;line-height:1.75}
.counts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:22px 0 0}
.count{padding:14px;border:1px solid rgba(91,70,126,.14);border-radius:15px;background:#f8f6fc}
.count span{display:block;color:#777080;font-size:12px;font-weight:700}
.count strong{display:block;margin-top:5px;font-size:25px}
.status{min-height:46px;margin:14px 0 0;padding:12px 13px;border-radius:13px;background:#f1ecfa;color:#5f457f;font-size:13px;line-height:1.6}
.status.error{background:#fff0f0;color:#a33434}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
button,a{min-height:44px;border-radius:12px;padding:11px 15px;font:800 13px/1.25 inherit;text-decoration:none;cursor:pointer}
button{border:0;background:#7b52c4;color:#fff;box-shadow:0 8px 20px rgba(123,82,196,.2)}
a{display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(91,70,126,.2);background:#fff;color:#43374f}
button:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.privacy{margin:17px 0 0;color:#817a89;font-size:11.5px;line-height:1.65}
[hidden]{display:none!important}
@media(max-width:420px){body{padding:10px}main{padding:21px;border-radius:19px}.actions>*{width:100%}}
@media(prefers-color-scheme:dark){
  :root{background:#18151e;color:#f0edf5}
  body{background:radial-gradient(circle at 10% 10%,rgba(147,104,216,.2),transparent 40%),#18151e}
  main{background:rgba(37,32,45,.94);border-color:rgba(214,197,235,.14);box-shadow:0 24px 70px rgba(0,0,0,.35)}
  .intro,.privacy{color:#aaa2b3}.count{background:#2d2736;border-color:rgba(214,197,235,.13)}
  .count span{color:#b7afbf}.status{background:#342a43;color:#d5c0ef}.status.error{background:#48292d;color:#ffc4c4}
  a{background:#2d2736;border-color:rgba(214,197,235,.18);color:#f0edf5}
}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">★</div>
  <h1>找回旧域收藏</h1>
  <p class="intro">此页面只读取保存在旧 <code>pages.dev</code> 域名下的法典图鉴与共创广场收藏。数据不会上传服务器，迁移完成后旧收藏仍会保留。</p>
  <div class="counts" aria-label="旧域收藏数量">
    <div class="count"><span>法典图鉴</span><strong id="atlasCount">—</strong></div>
    <div class="count"><span>共创广场</span><strong id="communityCount">—</strong></div>
  </div>
  <p id="status" class="status" role="status" aria-live="polite">正在读取旧域收藏…</p>
  <div class="actions">
    <button id="downloadBtn" type="button" hidden>下载 JSON 备份</button>
    <a id="returnLink" href="https://novelai.quicktagcloud.com/">返回新域名</a>
  </div>
  <p class="privacy">只能找回当前设备、当前浏览器中仍保存的数据。关闭本页、迁移或下载均不会删除旧收藏。</p>
</main>
<script>
(() => {
  'use strict';

  const VERSION = 1;
  const OLD_ORIGIN = 'https://novelai-tag.pages.dev';
  const NEW_ORIGIN = 'https://novelai.quicktagcloud.com';
  const FORMAT = 'novelai-tag-favorites';
  const ATLAS_KEY = 'fadian-favs';
  const COMMUNITY_KEY = 'community-favorites-v1';
  const MAX_BYTES = 2 * 1024 * 1024;
  const MAX_ITEMS = 30000;
  const MAX_ATLAS_FIELD_LENGTH = 128;
  const MAX_COMMUNITY_ID_LENGTH = 256;
  const CONTROL_CHAR_RE = /[\u0000-\u001f\u007f-\u009f]/;
  const TYPES = {
    ready: 'ready',
    request: 'request',
    payload: 'payload',
    result: 'result',
  };

  const byId = id => document.getElementById(id);
  const status = byId('status');
  const downloadBtn = byId('downloadBtn');
  const localHost = location.hostname === '127.0.0.1' || location.hostname === 'localhost';
  const requestedTarget = new URL(location.href).searchParams.get('targetOrigin') || '';
  const localTargetAllowed = /^http:\/\/(?:127\.0\.0\.1|localhost):\d+$/.test(requestedTarget);
  const targetOrigin = localHost && localTargetAllowed ? requestedTarget : NEW_ORIGIN;
  const originAllowed = location.origin === OLD_ORIGIN || localHost;
  const nonce = new URLSearchParams(location.hash.slice(1)).get('nonce') || '';

  function setStatus(message, error = false) {
    status.textContent = message;
    status.classList.toggle('error', error);
  }

  function validateIdentifier(value, maxLength, label) {
    if (typeof value !== 'string'
      || !value.length
      || !value.trim().length
      || value.length > maxLength
      || CONTROL_CHAR_RE.test(value)) {
      throw new Error(`${label}格式无效`);
    }
    return value;
  }

  function parseAtlasKey(key) {
    if (typeof key !== 'string') throw new Error('法典收藏标识不是字符串');
    const separator = key.indexOf(':');
    if (separator <= 0 || separator === key.length - 1) throw new Error('法典收藏标识无效');
    return {
      codexId: validateIdentifier(
        key.slice(0, separator),
        MAX_ATLAS_FIELD_LENGTH,
        '法典收藏 codexId ',
      ),
      entryId: validateIdentifier(
        key.slice(separator + 1),
        MAX_ATLAS_FIELD_LENGTH,
        '法典收藏 entryId ',
      ),
    };
  }

  function readStoredArray(key, validateItem) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return { items: [], warning: '' };
      const value = JSON.parse(raw);
      if (!Array.isArray(value)) throw new Error('不是数组');
      value.forEach(validateItem);
      return { items: value, warning: '' };
    } catch {
      return {
        items: [],
        warning: `${key} 已损坏或无法读取，已跳过这一类收藏`,
      };
    }
  }

  function atlasBackupItems(keys) {
    return keys.map(parseAtlasKey);
  }

  function payloadBytes(value) {
    return new TextEncoder().encode(JSON.stringify(value)).byteLength;
  }

  function validateFavorites(favorites) {
    const total = favorites.atlasKeys.length + favorites.communityIds.length;
    if (total > MAX_ITEMS) throw new Error('旧域收藏超过 30,000 条，无法自动迁移');
    if (payloadBytes(favorites) > MAX_BYTES) throw new Error('旧域收藏超过 2 MiB，无法自动迁移');
    return favorites;
  }

  function downloadBackup(favorites) {
    const backup = {
      format: FORMAT,
      version: VERSION,
      exportedAt: new Date().toISOString(),
      favorites: {
        atlas: atlasBackupItems(favorites.atlasKeys),
        community: favorites.communityIds,
      },
    };
    const text = JSON.stringify(backup);
    if (new TextEncoder().encode(text).byteLength > MAX_BYTES) {
      throw new Error('生成的收藏备份超过 2 MiB');
    }
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json;charset=utf-8' }));
    const link = document.createElement('a');
    link.href = url;
    link.download = `novelai-tag-favorites-${new Date().toISOString().slice(0, 10)}.json`;
    link.hidden = true;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 0);
  }

  if (!originAllowed) {
    setStatus('请从旧 pages.dev 域名打开此救援页面。', true);
    downloadBtn.hidden = true;
    return;
  }

  let favorites;
  let readWarnings = [];
  try {
    const atlasStored = readStoredArray(ATLAS_KEY, parseAtlasKey);
    const communityStored = readStoredArray(
      COMMUNITY_KEY,
      value => validateIdentifier(value, MAX_COMMUNITY_ID_LENGTH, '共创广场收藏标识'),
    );
    readWarnings = [atlasStored.warning, communityStored.warning].filter(Boolean);
    if (readWarnings.length === 2) {
      throw new Error('旧域的两类收藏存储均已损坏或无法读取，未进行迁移');
    }
    favorites = validateFavorites({
      atlasKeys: atlasStored.items,
      communityIds: communityStored.items,
    });
    byId('atlasCount').textContent = String(favorites.atlasKeys.length);
    byId('communityCount').textContent = String(favorites.communityIds.length);
    downloadBtn.hidden = favorites.atlasKeys.length + favorites.communityIds.length === 0;
    downloadBtn.addEventListener('click', () => {
      try {
        downloadBackup(favorites);
        setStatus('JSON 备份已下载。请回到新域名，在“收藏备份与恢复”中选择该文件。');
      } catch (error) {
        setStatus(error.message || '无法生成 JSON 备份。', true);
      }
    });
  } catch (error) {
    setStatus(error.message || '读取旧域收藏失败。', true);
    return;
  }

  if (!window.opener || !nonce) {
    const message = favorites.atlasKeys.length + favorites.communityIds.length
      ? '已找到旧收藏。请下载 JSON 备份，再到新域名恢复。'
      : '当前浏览器的旧域名下没有发现收藏。';
    setStatus(readWarnings.length ? `${message} 注意：${readWarnings.join('；')}。` : message, Boolean(readWarnings.length));
    return;
  }

  let completed = false;
  const timeout = setTimeout(() => {
    if (completed) return;
    setStatus('自动连接超时。你仍可下载 JSON 备份后手动恢复。', true);
  }, 20000);

  window.addEventListener('message', event => {
    if (event.origin !== targetOrigin
      || event.source !== window.opener
      || !event.data
      || event.data.version !== VERSION
      || event.data.nonce !== nonce) return;

    if (event.data.type === TYPES.request) {
      window.opener.postMessage({
        type: TYPES.payload,
        version: VERSION,
        nonce,
        atlasKeys: favorites.atlasKeys,
        communityIds: favorites.communityIds,
      }, targetOrigin);
      setStatus('正在将旧收藏合并到新域名…');
      return;
    }

    if (event.data.type !== TYPES.result) return;
    completed = true;
    clearTimeout(timeout);
    if (event.data.status === 'migrated') {
      const message = `找回完成：新增 ${event.data.added || 0} 条，${event.data.duplicate || 0} 条已存在。`;
      if (readWarnings.length) {
        setStatus(`${message} 注意：${readWarnings.join('；')}。`, true);
      } else {
        setStatus(`${message} 本页即将关闭。`);
        setTimeout(() => window.close(), 1100);
      }
    } else if (event.data.status === 'empty') {
      if (readWarnings.length) {
        setStatus(`未发现可迁移的收藏。注意：${readWarnings.join('；')}。`, true);
      } else {
        setStatus('旧域没有发现可迁移的收藏。本页即将关闭。');
        setTimeout(() => window.close(), 1100);
      }
    } else {
      setStatus(event.data.message || '自动迁移失败，请下载 JSON 备份后手动恢复。', true);
    }
  });

  window.opener.postMessage({
    type: TYPES.ready,
    version: VERSION,
    nonce,
    counts: {
      atlas: favorites.atlasKeys.length,
      community: favorites.communityIds.length,
    },
  }, targetOrigin);
  setStatus('已读取旧收藏，正在连接新域名…');
})();
</script>
</body>
</html>
